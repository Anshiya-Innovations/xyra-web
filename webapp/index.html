<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Xyra</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Internal application pages zoom to fit screen at 100% browser zoom */
        html.xyra-app-zoomed,
        html:has(.sapTntToolPage),
        html:has(.sapTNTToolPage) {
            zoom: 0.82;
            -webkit-text-size-adjust: 100%;
        }

        /* Login page strictly stays at unscaled 100% zoom for edge-to-edge layout */
        html.xyra-login-active,
        html:has(.xyraLoginPageBg) {
            zoom: 1 !important;
            -webkit-text-size-adjust: 100%;
        }

        /* Pre-boot loading state: pure HTML/CSS, shown before UI5 core itself has
           finished loading (data-sap-ui-preload="none" means every framework
           module is a separate request, so this can genuinely take a few
           seconds). `position: fixed` so it can never affect document flow
           regardless of when/how it's removed - the ComponentSupport bootstrap
           appends the rendered app alongside this div rather than replacing
           it, so removal is handled explicitly by the script below, not left
           to chance. */
        .xyraBootLoader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: #f8fafc;
            z-index: 9999;
        }

        .xyraBootLoader .xyraSpinnerRing {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #533bff;
            border-radius: 50%;
            animation: xyraBootSpin 0.8s linear infinite;
        }

        @keyframes xyraBootSpin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        (function() {
            function updateRouteState() {
                var h = window.location.hash || "";
                var isLogin = !h || h === "#" || h === "#/" || h === "#/Login";
                var docEl = document.documentElement;
                if (isLogin) {
                    docEl.classList.remove("xyra-app-zoomed");
                    docEl.classList.add("xyra-login-active");
                } else {
                    docEl.classList.add("xyra-app-zoomed");
                    docEl.classList.remove("xyra-login-active");
                }
            }
            updateRouteState();
            window.addEventListener("hashchange", updateRouteState);
        })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=20260908_28">
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.150.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "xyraweb": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="none"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="xyraweb"
        data-id="container"
        data-settings='{"id" : "xyraweb"}'
        data-handle-validation="true"
    ></div>
    <div id="xyraBootLoader" class="xyraBootLoader">
        <div class="xyraSpinnerRing"></div>
    </div>
    <script>
        (function () {
            var target = document.querySelector('[data-sap-ui-component]');
            var loader = document.getElementById('xyraBootLoader');
            if (!target || !loader) { return; }
            // The ComponentSupport bootstrap appends the rendered app as a
            // child of this div rather than replacing existing content, so
            // the loader (a sibling, not a child - see above) is removed
            // explicitly the moment that first child actually appears.
            var observer = new MutationObserver(function () {
                if (target.children.length > 0) {
                    loader.remove();
                    observer.disconnect();
                }
            });
            observer.observe(target, { childList: true });
        })();
    </script>
</body>
</html>
