<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Xyra</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Internal application pages zoom to fit screen at 100% browser zoom */
        html.xyra-app-zoomed,
        html:has(.sapTntToolPage),
        html:has(.sapTNTToolPage) {
            zoom: 0.82;
            -webkit-text-size-adjust: 100%;
        }

        /* Login page strictly stays at unscaled 100% zoom for edge-to-edge layout */
        html.xyra-login-active,
        html:has(.xyraLoginPageBg) {
            zoom: 1 !important;
            -webkit-text-size-adjust: 100%;
        }
    </style>
    <script>
        (function() {
            function updateRouteState() {
                var h = window.location.hash || "";
                var isLogin = !h || h === "#" || h === "#/" || h === "#/Login";
                var docEl = document.documentElement;
                if (isLogin) {
                    docEl.classList.remove("xyra-app-zoomed");
                    docEl.classList.add("xyra-login-active");
                } else {
                    docEl.classList.add("xyra-app-zoomed");
                    docEl.classList.remove("xyra-login-active");
                }
            }
            updateRouteState();
            window.addEventListener("hashchange", updateRouteState);
        })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=20260908_22">
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.150.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "xyraweb": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="none"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="xyraweb"
        data-id="container"
        data-settings='{"id" : "xyraweb"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
